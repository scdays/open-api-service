spring:
  kafka:
    bootstrap-servers: 172.16.3.32:9092
    consumer:
      group-id: open-api-task-center
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
      ack-mode: manual
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  redis:
    database: 2
    host: 172.16.3.32
    password: 8STRYXLCtn8
    port: 6379
    enable: true
    timeout: 10000
  datasource:
    dynamic:
      druid:
        initial-size: 3
        max-active: 10
        min-idle: 1
        max-wait: 60000
        validation-query: SELECT 'x'
        test-while-idle: true
        test-on-borrow: true
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://172.16.3.32:3306/open_api?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: secure
          password: 8STRYXLCtn8
          driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  mapperLocations: classpath*:/mapper/*.xml
  configuration:
    mapUnderscoreToCamelCase: true
common:
  data:
    type: mysql
    dir: db/${common.data.type}
    enable: true
    init:
      enable: true
  crypto:
    type: AES
    key: eWxtZkRseFhLcm04Skc0OWdGYlUwUT09
  ftp:
    type: SFTP
    host: 172.16.3.32
    port: 22
    user: lysrmpxd
    password: 8STRYXLCtn8
    dir: /vulnerability/
open-api:
  engine:
    # mock | vul-pass | task-center（演示直连 vuln-task-center）
    adapter-mode: task-center
  task-center:
    # Feign 使用 Nacos 服务名 vuln-task-center，勿配网关 :7000（会 401）
    poll-enabled: true
    poll-interval-ms: 30000
    report-archive:
      enabled: true
    survey-capture:
      retry-enabled: true
      max-attempts: 6
      retry-interval-ms: 5000
      max-wait-ms: 180000
    kafka:
      enabled: true
      queue-consume-enabled: true
      group-id: open-api-task-center
      topic-task-finish: task_finish_topic
      topic-download-report-finish: download_report_finish_topic
      queue-poll-interval-ms: 2000
      queue-batch-size: 5
      max-retry: 3
  svmp:
    engine-service-name: vul-pass
    engine-path-prefix: ""
    dispatch:
      # 须为 vul-pass 指令库中已存在的 orderId（格式 1-31-19位数字）
      order-id: ""
      tsk-phase: 1
      proc-method: 1022
      eng-hashes:
        - NA
  token:
    expires-in-seconds: 86400   # JWT 过期与 Redis TTL（对齐 clover JWTUtils.create，单位秒）
  idempotency:
    ttl-seconds: 86400          # 实例写操作 Idempotency-Key 缓存有效期（24h，文档 §4.2）
  admin:
    api-key: dev-internal-admin-key-change-in-prod
  export:
    enabled: true
    ttl-days: 7
    # open-api | open-api-path | file-sharing
    download-url-mode: open-api
  partner-gateway:
    public-base-url: http://172.16.3.32:35770
  file-sharing:
    public-base-url: http://172.16.4.192
    download-username: admin
  webhook:
    enabled: true
    test-receiver-enabled: true
    test-receiver-base-url: http://127.0.0.1:35780
    test-receiver-path: /internal/dev/webhook/receive

# EventBus 配置：webhook 事件跨服务发布（open-api-service 发布 → platform-admin 消费投递），
# 与 partner-gateway / platform-admin 同 Kafka 集群（172.16.3.32:9092）。
vtc:
  asset-security:
    eventbus:
      enabled: true
      transport: kafka
      app-name: open-api-service
      domain: open-platform
      kafka:
        bootstrap-servers: 172.16.3.32:9092
      dlq:
        enabled: true
        topic-suffix: .DLQ
      telemetry:
        enabled: false

info:
  release:
    version: v1.0.0

# Knife4j 文档（对齐 clover / spore-starter-core · Swagger2Config）
knife4j:
  enable: true
  production: false
  setting:
    language: zh-CN

logging:
  level:
    com.vtc.openapi: debug
